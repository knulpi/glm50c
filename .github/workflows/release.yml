name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The frozen binary inherits the build interpreter's stdlib. uv's managed
# Pythons (python-build-standalone) are compiled WITHOUT Bluetooth socket
# support, so we must build against a system Python (distro build on Linux,
# setup-python on Windows) and verify AF_BLUETOOTH before building.
env:
  UV_PYTHON_PREFERENCE: only-system

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: glm-logger-linux-x86_64
            binary: dist/glm-logger
          - os: windows-latest
            artifact: glm-logger-windows-x86_64.exe
            binary: dist/glm-logger.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group build
      - name: Ensure the build Python has Bluetooth sockets
        run: uv run python -c "import socket; assert hasattr(socket, 'AF_BLUETOOTH'), 'build Python lacks AF_BLUETOOTH'"
      - run: >
          uv run pyinstaller --onefile --name glm-logger --paths src
          --collect-all piper --noconfirm packaging/pyinstaller_entry.py
      - run: mv ${{ matrix.binary }} ${{ matrix.artifact }}
        shell: bash
      - name: Attach binary to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
